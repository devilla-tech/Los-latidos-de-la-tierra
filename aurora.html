
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los latidos de la Tierra | Experiencia 3D</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060d;
    color-scheme: dark;
}

#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
}

#scene canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.effects {
    position: fixed;
    z-index: 10;
    right: clamp(10px, 2vw, 26px);
    top: clamp(10px, 2vw, 26px);
    display: grid;
    gap: 8px;
    font: 14px system-ui;
    width: min(260px, calc(100vw - 20px));
}

.effects button {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    color: #f4f0ff;
    background: #141b30;
    border: 1px solid #526381;
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    font: inherit;
}

.effects button[aria-pressed="true"] {
    border-color: #79e7cf;
}

.effects button:focus-visible {
    outline: 2px solid white;
    outline-offset: 3px;
}

.effect-arrow {
    color: #aab5ce;
    transition: transform .2s;
}

.effects button[aria-pressed="true"] .effect-arrow {
    transform: rotate(90deg);
    color: #79e7cf;
}

.cloud-intensity {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px 8px;
    align-items: center;
    padding: 8px;
    color: #f4f0ff;
    background: #141b30;
    border-radius: 9px;
    font-size: 12px;
}

.cloud-intensity input {
    grid-column: 1/-1;
    width: 100%;
    margin: 0;
    accent-color: #79e7cf;
    cursor: pointer;
}

.cloud-intensity output {
    font-variant-numeric: tabular-nums;
}

@media(max-width:600px) {
    .effects {
        width: 190px;
        font-size: 12px;
    }

    .effects button {
        padding: 8px 9px;
    }
}
</style>
</head>

<body>

<div id="scene"></div>

<div class="effects" role="group" aria-label="Efectos del planeta">

    <button type="button" id="toggle-aurora" aria-pressed="true">
        Aurora boreal
        <span class="effect-arrow" aria-hidden="true">▸</span>
    </button>

    <button type="button" id="toggle-water" aria-pressed="false">
        Olas del mar
        <span class="effect-arrow" aria-hidden="true">▸</span>
    </button>

    <button type="button" id="toggle-temperature" aria-pressed="false" title="Temperatura simulada">
        Temperatura continental
        <span class="effect-arrow" aria-hidden="true">▸</span>
    </button>

    <button type="button" id="toggle-clouds" aria-pressed="false">
        Nubes
        <span class="effect-arrow" aria-hidden="true">▸</span>
    </button>

    <label class="cloud-intensity" for="cloud-intensity">
        <span>Intensidad de nubes</span>
        <output id="cloud-intensity-value" for="cloud-intensity">100 %</output>

        <input type="range" id="cloud-intensity"
            min="0" max="200" step="1" value="100">
    </label>

</div>

<script type="module">

const mount = document.querySelector('#scene');

try {

const THREE = await import('https://esm.sh/three@0.160.1');

const scene = new THREE.Scene();

// CÁMARA CENTRADA
const camera = new THREE.PerspectiveCamera(44, 1, .1, 200);
camera.position.set(0, 0, 3.6);
camera.lookAt(0, 0, 0);

scene.background = new THREE.Color(0x05060d);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.75;

mount.appendChild(renderer.domElement);

// GRUPO DE LA TIERRA CENTRADO
const globe = new THREE.Group();
globe.position.set(0, 0, 0);
scene.add(globe);

const loader = new THREE.TextureLoader();

const load = url => new Promise((resolve, reject) =>
    loader.load(url, resolve, undefined, reject)
);

const urls = [
    'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
    'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
];

let tex = null;

for (const url of urls) {
    try {
        tex = await load(url);
        break;
    } catch(e) {}
}

if (!tex) {
    throw Error('No se pudo descargar la textura terrestre. Comprueba Internet.');
}

tex.colorSpace = THREE.SRGBColorSpace;

const uniforms = {
    uMap: {value: tex},
    uTime: {value: 0},
    uStrength: {value: 0},
    uTemperature: {value: 0},
    uThermalTime: {value: 0}
};

const material = new THREE.ShaderMaterial({

uniforms,

vertexShader: `
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPos;

void main() {
    vUv = uv;
    vNormal = normalize(normalMatrix * normal);

    vec4 mv = modelViewMatrix * vec4(position,1.);
    vPos = mv.xyz;

    gl_Position = projectionMatrix * mv;
}
`,

fragmentShader: `
uniform sampler2D uMap;
uniform float uTime;
uniform float uStrength;
uniform float uTemperature;
uniform float uThermalTime;

varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPos;

float hash(vec2 p) {
    return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 s = f*f*(3.-2.*f);

    return mix(
        mix(hash(i),hash(i+vec2(1.,0.)),s.x),
        mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),s.x),
        s.y
    );
}

float textureCloud(vec2 p) {
    return .56*noise(p)+.29*noise(p*2.13)+.15*noise(p*4.31);
}

float regionalPatch(vec2 uv,vec2 center,vec2 size) {
    vec2 offset = uv-center;
    offset.x = fract(offset.x+.5)-.5;

    return 1.-smoothstep(.49,1.,length(offset/(size*1.22)));
}

float inlandPatch(vec2 point,vec2 center,vec2 extent) {
    return 1.-smoothstep(.70,1.,length((point-center)/extent));
}

void main() {

vec3 base = texture2D(uMap,vUv).rgb;

float ocean = smoothstep(.015,.115,base.b-max(base.r,base.g));

vec2 p = vec2(vUv.x * 18., vUv.y * 12.);

float twist =
    sin(p.x * 1.15 + 2.2 * sin(p.y * 1.9 + uTime * .85))
    + cos(p.y * 1.45 - p.x * .6 - uTime * .72);

vec2 q = p + vec2(
    sin(p.y * 2.0 + twist * 2.1 + uTime * .95),
    cos(p.x * 1.3 - twist * 1.8 - uTime * .84)
) * 1.35;

float filaments = sin(q.x * 7. + q.y * 4. +
    3.8 * sin(q.y * 2.7 + uTime) - uTime * 4.);

float crossWave = sin(q.x * 13. - q.y * 9. +
    3. * cos(q.x * 2.4 - uTime) - uTime * 5.2);

float broad = sin(q.y * 2.9 + q.x * 1.8 +
    2.5 * twist - uTime * 1.5);

float crest = smoothstep(.22,.93,
    .53 * filaments + .28 * crossWave + .34 * broad);

float foam = crest * (.50 + .50 *
    smoothstep(-.15,.65,sin(q.x * 19. + q.y * 22. + uTime * 3.)));

vec3 n = normalize(vNormal);
vec3 lightDir = normalize(vec3(-.5,.35,1.));

float diffuse = max(dot(n,lightDir),0.);
float latitude = abs(vUv.y-.5)*2.;

float oceanHue = smoothstep(-.85,.90,
    broad*.55*clamp(uStrength,0.,1.)+(.65-latitude)*.7+base.g);

vec3 water = mix(
    vec3(.13,.26,.85),
    vec3(.04,.83,.88),
    oceanHue
);

water = mix(water,vec3(.38,.28,.90),
    smoothstep(.45,.88,latitude)*.55);

float current = pow(.5 + .5 * sin(
    2.1*q.x + 3.6*q.y + 1.8*twist - .7*uTime
),5.);

water = mix(water,vec3(.78,.97,1.),
    clamp((foam*.83+current*.19)*uStrength,0.,.93));

float brightness = dot(base,vec3(.2126,.7152,.0722));

float vegetation = smoothstep(-.17,.035,base.g-base.r)*
    smoothstep(-.025,.095,base.g-base.b);

float desert = smoothstep(.035,.24,base.r-base.b)*
    smoothstep(.11,.55,brightness);

vec3 land = mix(
    clamp(vec3(brightness)+(base-brightness)*1.65,0.,1.),
    vec3(.97,.62,.24),
    desert*.74
);

land = mix(land,
    mix(vec3(.07,.49,.23),vec3(.46,.88,.23),
    smoothstep(.04,.45,brightness)),
    vegetation*.84
);

float ice = smoothstep(.54,.87,brightness)*
    (1.-smoothstep(.04,.16,max(base.r,base.g)-base.b));

land = mix(land,vec3(.84,.95,1.),ice*.62);

vec3 color = mix(land,water,ocean);
color *= .59+.41*diffuse;

float rim = pow(1.-max(dot(n,normalize(-vPos)),0.),3.);

vec3 rimColor = mix(
    vec3(.20,.93,1.),
    vec3(.74,.42,1.),
    smoothstep(-.8,.8,n.x)
);

color = mix(color,rimColor,rim*.7);

if(uTemperature>.5) {

    float blueExcess = base.b-max(base.r,base.g);

    float blueRatio = blueExcess/
        max(.025,max(base.r,max(base.g,base.b)));

    float seaMask = max(ocean,
        max(smoothstep(.003,.017,blueExcess),
        smoothstep(.045,.15,blueRatio)));

    vec2 degrees = (vUv-.5)*vec2(360.,180.);

    float amazon = inlandPatch(degrees,vec2(-60.,-6.),vec2(17.,13.));
    float brazil = inlandPatch(degrees,vec2(-51.,-13.),vec2(11.,12.));
    float northBrazil = inlandPatch(degrees,vec2(-46.,-6.),vec2(7.,6.));
    float northernAndes = inlandPatch(degrees,vec2(-73.,3.),vec2(5.,7.));
    float centralAndes = inlandPatch(degrees,vec2(-68.,-16.),vec2(5.,13.));
    float chaco = inlandPatch(degrees,vec2(-61.,-23.),vec2(7.,9.));
    float pampas = inlandPatch(degrees,vec2(-64.,-34.),vec2(6.,10.));
    float patagonia = inlandPatch(degrees,vec2(-68.,-46.),vec2(3.,7.));

    float southInterior = max(
        max(max(amazon,brazil),max(northBrazil,northernAndes)),
        max(max(centralAndes,chaco),max(pampas,patagonia))
    );

    float sahara = inlandPatch(degrees,vec2(12.,23.),vec2(23.,8.));
    float centralAfrica = inlandPatch(degrees,vec2(22.,5.),vec2(14.,15.));
    float southernAfrica = inlandPatch(degrees,vec2(24.,-17.),vec2(9.,12.));

    float inland = max(southInterior,
        max(sahara,max(centralAfrica,southernAfrica)));

    float landMask = max(1.-smoothstep(.06,.34,seaMask),inland);

    float longitude = vUv.x*6.2831853;

    vec2 drift = vec2(
        cos(longitude+uThermalTime*.024),
        sin(longitude+uThermalTime*.024)
    )*6.;

    vec2 cloudPosition = drift+vec2(8.,23.)*vUv.y;

    float billows = textureCloud(cloudPosition);

    float northAmerica = regionalPatch(vUv,vec2(.218,.774),vec2(.107,.161));
    float centralAmerica = regionalPatch(vUv,vec2(.248,.602),vec2(.046,.061));
    float southAmerica = regionalPatch(vUv,vec2(.334,.380),vec2(.133,.315));

    float southCoverage = max(southAmerica,southInterior);

    float america = max(northAmerica,max(centralAmerica,southAmerica));

    float africa = regionalPatch(vUv,vec2(.556,.507),vec2(.121,.209));
    float europe = regionalPatch(vUv,vec2(.554,.783),vec2(.103,.109));
    float asia = regionalPatch(vUv,vec2(.760,.73),vec2(.155,.182));
    float australia = regionalPatch(vUv,vec2(.872,.359),vec2(.084,.119));
    float newZealand = regionalPatch(vUv,vec2(.980,.268),vec2(.039,.075));
    float newGuinea = regionalPatch(vUv,vec2(.896,.462),vec2(.067,.050));

    float oceania = max(australia,max(newZealand,newGuinea));

    float region = max(max(america,africa),
        max(max(europe,asia),oceania));

    float floorGlow = mix(.42,.75,max(inland,southCoverage));

    float core = mix(floorGlow,1.,
        smoothstep(.24,.66,billows));

    float halo = .42+.58*smoothstep(.13,.42,billows)*
        (1.-.55*core);

    float cloudOpacity = landMask*
        mix(.67,1.,min(1.,region+.25*max(america,africa)));

    float heat = 1.-smoothstep(.15,.78,latitude);

    vec3 blue = vec3(.10,.40,1.);
    vec3 yellow = vec3(1.,.86,.12);
    vec3 orange = vec3(1.,.37,.06);

    vec3 thermal = mix(blue,yellow,
        smoothstep(.29,.48,heat));

    thermal = mix(thermal,orange,
        smoothstep(.62,.82,heat));

    float pulse = .9+.1*sin(uThermalTime*1.15+billows*6.);

    vec3 haloColor = thermal;

    vec3 glow = clamp(
        thermal*core*(.96+.14*america)
        +haloColor*halo*(.78+.17*america),
        0.,1.
    )*cloudOpacity*pulse;

    vec2 veilPosition = cloudPosition*1.8+
        vec2(.21,-.82)*uThermalTime;

    float veil = smoothstep(.43,.75,textureCloud(veilPosition));

    float ribbon = .5+.5*sin(
        vUv.y*135.+3.6*billows-uThermalTime*1.8
    );

    float shimmer = veil*smoothstep(.58,.92,ribbon)*landMask*.52;

    color = 1.-(1.-clamp(color,0.,1.))*(1.-glow);

    color = mix(color,mix(thermal,vec3(1.),.6),shimmer);
}

gl_FragColor = vec4(clamp(color,0.,1.),1.);

}`
});

globe.add(new THREE.Mesh(
    new THREE.SphereGeometry(1,160,112),
    material
));


// ==========================================
// AURORAS BOREALES
// ==========================================

const auroraUniforms = {
    time: {value: 0},
    intensity: {value: .75}
};

const auroraMaterial = new THREE.ShaderMaterial({

    uniforms: auroraUniforms,

    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,

    vertexShader: `
    uniform float time;
    varying vec2 curtain;

    void main() {

        curtain = uv;

        float longitude = uv.x * 6.2831853;
        float height = uv.y;

        float latitude = 1.15
            + .105 * sin(longitude * 3. + time * .4)
            + .048 * sin(longitude * 9. - time * .6)
            + .025 * sin(longitude * 17. + height * 5. - time * .9);

        float radius = 1.016 + height * .32;

        vec3 point = radius * vec3(
            cos(latitude) * cos(longitude),
            sin(latitude),
            cos(latitude) * sin(longitude)
        );

        gl_Position = projectionMatrix *
            modelViewMatrix * vec4(point,1.);
    }`,

    fragmentShader: `
    uniform float time;
    uniform float intensity;
    varying vec2 curtain;

    void main() {

        float longitude = curtain.x * 6.2831853;
        float height = curtain.y;

        float fold = sin(
            longitude * 41. +
            sin(longitude * 11. - time) * 2. +
            height * 3.
        );

        float rays = pow(.5 + .5 * fold,3.);
        float pulse = .62 + .38 * sin(longitude * 5. - time * .8);

        float fade = smoothstep(0.,.09,height) *
            (1. - smoothstep(.15,1.,height));

        vec3 color = mix(
            vec3(.14,1.,.46),
            vec3(.23,.78,1.),
            smoothstep(.11,.55,height)
        );

        color = mix(color,vec3(1.,.24,.81),
            smoothstep(.45,.91,height));

        gl_FragColor = vec4(
            color,
            intensity * fade * (.37+.63*rays) * pulse
        );
    }`
});

const aurora = new THREE.Mesh(
    new THREE.PlaneGeometry(1,1,384,18),
    auroraMaterial
);

aurora.frustumCulled = false;
globe.add(aurora);


// ==========================================
// CONTROLES DE EFECTOS
// ==========================================

function bindEffect(id, apply) {

    const button = document.getElementById(id);

    apply(button.getAttribute('aria-pressed') === 'true');

    button.addEventListener('click', () => {

        const enabled =
            button.getAttribute('aria-pressed') !== 'true';

        button.setAttribute('aria-pressed',String(enabled));

        apply(enabled);
    });
}

bindEffect('toggle-aurora', enabled => {
    aurora.visible = enabled;
});

bindEffect('toggle-temperature', enabled => {
    uniforms.uTemperature.value = Number(enabled);
});

bindEffect('toggle-water', enabled => {
    uniforms.uStrength.value = enabled ? 1.2 : 0;
});


// ==========================================
// NUBES
// ==========================================

const cloudTime = {value:0};
const cloudCover = {value:0};

const cloudLayer = new THREE.Mesh(
    new THREE.SphereGeometry(1.012,128,80),

    new THREE.ShaderMaterial({

        transparent:true,
        depthWrite:false,

        uniforms: {
            time: cloudTime,
            cloudCover
        },

        vertexShader: `
        varying vec2 cloudUV;

        void main() {
            cloudUV = uv;

            gl_Position = projectionMatrix *
                modelViewMatrix * vec4(position,1.);
        }`,

        fragmentShader: `

        uniform float time;
        uniform float cloudCover;

        varying vec2 cloudUV;

        float hash(vec2 p) {
            return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
        }

        float noise(vec2 p) {

            vec2 i = floor(p), f = fract(p);
            vec2 s = f*f*(3.-2.*f);

            return mix(
                mix(hash(i),hash(i+vec2(1.,0.)),s.x),
                mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),s.x),
                s.y
            );
        }

        float textureCloud(vec2 p) {
            return .56*noise(p)+.29*noise(p*2.13)+.15*noise(p*4.31);
        }

        void main() {

            float longitude = 6.2831853*cloudUV.x;

            vec2 drift = vec2(
                cos(longitude+time*.017),
                sin(longitude+time*.017)
            )*13.;

            vec2 p = drift+vec2(18.,53.)*cloudUV.y;

            float patches = smoothstep(.59,.79,textureCloud(p))*.50;

            patches *= smoothstep(0.,.09,cloudUV.y)*
                (1.-smoothstep(.91,1.,cloudUV.y));

            gl_FragColor = vec4(
                vec3(.86,.92,1.),
                cloudCover*patches
            );
        }`
    })
);

globe.add(cloudLayer);

const cloudButton = document.getElementById('toggle-clouds');
const cloudIntensity = document.getElementById('cloud-intensity');
const cloudIntensityValue = document.getElementById('cloud-intensity-value');

function updateCloudIntensity() {

    const intensity = Number(cloudIntensity.value);

    const enabled =
        cloudButton.getAttribute('aria-pressed') === 'true';

    cloudIntensityValue.textContent = intensity + ' %';

    cloudCover.value = enabled ? intensity/100 : 0;

    cloudLayer.visible = cloudCover.value > 0;
}

bindEffect('toggle-clouds', updateCloudIntensity);

cloudIntensity.addEventListener('input',updateCloudIntensity);


// ==========================================
// ESTRELLAS
// ==========================================

const positions = [];
const starColors = [];

const starPalette = [
    0x90c9ff,
    0xffa3df,
    0xffdb9a,
    0x88ffe2
].map(color => new THREE.Color(color));

for(let i=0;i<2500;i++) {

    const x = (Math.random()-.5)*100;
    const y = (Math.random()-.5)*100;
    const z = (Math.random()-.5)*100;

    if(Math.hypot(x,y,z)>9) {

        positions.push(x,y,z);

        starColors.push(
            ...starPalette[i%starPalette.length].toArray()
        );
    }
}

const sg = new THREE.BufferGeometry();

sg.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions,3)
);

sg.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(starColors,3)
);

scene.add(new THREE.Points(
    sg,
    new THREE.PointsMaterial({
        vertexColors:true,
        size:.085,
        toneMapped:false
    })
));


// ==========================================
// ROTACION Y ZOOM
// ==========================================

let drag = false;
let px = 0;
let py = 0;

let angle = -1.5;
let tilt = .58;
let distance = 3.6;

const canvas = renderer.domElement;

canvas.addEventListener('pointerdown',e => {

    drag = true;

    px = e.clientX;
    py = e.clientY;

    canvas.setPointerCapture(e.pointerId);

    mount.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove',e => {

    if(!drag) return;

    angle += (e.clientX-px)*.007;

    tilt = Math.max(
        -1.45,
        Math.min(1.45,tilt+(e.clientY-py)*.007)
    );

    px = e.clientX;
    py = e.clientY;
});

canvas.addEventListener('pointerup',() => {
    drag = false;
    mount.style.cursor = 'grab';
});

canvas.addEventListener('pointercancel',() => {
    drag = false;
    mount.style.cursor = 'grab';
});

canvas.addEventListener('wheel',e => {

    e.preventDefault();

    distance = Math.max(
        1.3,
        Math.min(9,distance+e.deltaY*.003)
    );

},{passive:false});


// ==========================================
// SISTEMA DE AUDIO
// ==========================================

const notes = [130.81,196,261.63];

let audio;
let waves;
let filter;
let voices;
let wavePan;

let thermalVoices;
let cloudGain;
let cloudFilter;
let cloudPan;

const previous = {};

let nextAudioUpdate = 0;

const capture = document.createElement('canvas');

capture.width = capture.height = 64;

const pixels = capture.getContext('2d',{
    willReadFrequently:true
});


async function startSound() {

    if(!audio) {

        audio = new AudioContext();

        voices = notes.map((frequency,i) => {

            const tone = audio.createOscillator();
            const gain = audio.createGain();
            const pan = audio.createStereoPanner();

            tone.frequency.value = frequency;
            gain.gain.value = 0;

            tone.connect(gain)
                .connect(pan)
                .connect(audio.destination);

            tone.start();

            return {
                gain:gain.gain,
                pan:pan.pan,
                hue:[140,189,320][i]
            };
        });

        const buffer = audio.createBuffer(
            1,
            audio.sampleRate*4,
            audio.sampleRate
        );

        const samples = buffer.getChannelData(0);

        for(let i=0;i<samples.length;i++) {
            samples[i] = Math.random()*2-1;
        }

        // SONIDO DEL MAR

        const noise = audio.createBufferSource();

        noise.buffer = buffer;
        noise.loop = true;

        filter = audio.createBiquadFilter();
        filter.type = 'lowpass';
        filter.Q.value = .45;

        waves = audio.createGain();
        waves.gain.value = 0;

        wavePan = audio.createStereoPanner();

        noise.connect(filter)
            .connect(waves)
            .connect(wavePan)
            .connect(audio.destination);

        noise.start();

        // SONIDO DE LAS NUBES

        const cloudNoise = audio.createBufferSource();

        cloudNoise.buffer = buffer;
        cloudNoise.loop = true;

        cloudFilter = audio.createBiquadFilter();
        cloudFilter.type = 'bandpass';
        cloudFilter.Q.value = .7;

        cloudGain = audio.createGain();
        cloudGain.gain.value = 0;

        cloudPan = audio.createStereoPanner();

        cloudNoise.connect(cloudFilter)
            .connect(cloudGain)
            .connect(cloudPan)
            .connect(audio.destination);

        cloudNoise.start(0,1.7);

        // TEMPERATURA CONTINENTAL

        thermalVoices = [77.78,98.00,116.54].map(frequency => {

            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            const pan = audio.createStereoPanner();

            oscillator.frequency.value = frequency;
            gain.gain.value = 0;

            oscillator.connect(gain)
                .connect(pan)
                .connect(audio.destination);

            oscillator.start();

            return {
                volume:gain.gain,
                pan:pan.pan
            };
        });
    }

    await audio.resume();
}


// ==========================================
// CAPTURA DE PIXELES
// ==========================================

function framePixels() {

    pixels.drawImage(canvas,0,0,64,64);

    return pixels.getImageData(0,0,64,64).data;
}


function measure(effect,full,base) {

    const old = previous[effect];

    const levels = new Float32Array(full.length/4);

    let energy = 0;
    let movement = 0;
    let horizontal = 0;
    let blue = 0;
    let chroma = 0;

    for(let j=0;j<levels.length;j++) {

        const i = j*4;

        const r = Math.abs(full[i]-base[i]);
        const g = Math.abs(full[i+1]-base[i+1]);
        const b = Math.abs(full[i+2]-base[i+2]);

        const level = Math.max(r,g,b)/255;

        levels[j] = level;

        energy += level;

        if(old) {
            movement += Math.abs(level-old[j]);
        }

        horizontal += level*(2*(j%64)/63-1);

        blue += b;
        chroma += r+g+b;
    }

    previous[effect] = levels;

    return {
        energy,
        movement,
        blue:blue/Math.max(1,chroma),
        pan:Math.max(-1,Math.min(1,
            1.5*horizontal/Math.max(1,energy)))
    };
}


// ==========================================
// SONIDO DE LAS OLAS
// ==========================================

function setNoise(effect,full,base,gain,tone,stereo,now) {

    const {energy,movement,blue,pan} =
        measure(effect,full,base);

    const strength = 1-Math.exp(-energy/45);
    const accent = 1-Math.exp(-movement/30);

    gain.gain.setTargetAtTime(
        strength*(.10+.35*accent),
        now,
        .13
    );

    tone.frequency.setTargetAtTime(
        320+1150*blue+900*accent,
        now,
        .15
    );

    stereo.pan.setTargetAtTime(pan,now,.18);
}


// ==========================================
// SONIDO DE TEMPERATURA
// ==========================================

function thermalWeights(full,base,i) {

    const red = Math.max(0,full[i]-base[i]);
    const green = Math.max(0,full[i+1]-base[i+1]);
    const blue = Math.max(0,full[i+2]-base[i+2]);

    const r = red/Math.max(24,255-base[i]);
    const g = green/Math.max(24,255-base[i+1]);
    const b = blue/Math.max(24,255-base[i+2]);

    const level = Math.min(1,Math.max(red,green,blue)/255);

    const cold = Math.max(
        0,
        Math.min(1,(b-r)/Math.max(.01,b+r)*2.5)
    );

    const warm = (1-cold)*Math.max(
        0,
        Math.min(1,(r-b)/Math.max(.01,r+b)*2.5)
    );

    const yellow = Math.max(
        0,
        Math.min(1,(g/Math.max(.01,r)-.50)/.28)
    );

    return [
        level*cold,
        level*warm*yellow,
        level*warm*(1-yellow)
    ];
}


function updateTemperature(full,base,now) {

    const old = previous.temperature;

    const count = thermalVoices.length;

    const levels = new Float32Array(full.length/4*count);

    const energy = [0,0,0];
    const motion = [0,0,0];
    const horizontal = [0,0,0];

    for(let i=0,j=0;i<full.length;i+=4,j+=count) {

        const weights = thermalWeights(full,base,i);

        const x = 2*((i/4)%64)/63-1;

        for(let k=0;k<count;k++) {

            const level = weights[k];

            levels[j+k] = level;

            energy[k] += level;

            horizontal[k] += level*x;

            if(old) {
                motion[k] += Math.abs(level-old[j+k]);
            }
        }
    }

    previous.temperature = levels;

    thermalVoices.forEach((voice,k) => {

        const accent = 1+.3*(1-Math.exp(-motion[k]/10));

        voice.volume.setTargetAtTime(
            .064*(1-Math.exp(-energy[k]/22))*accent,
            now,
            .16
        );

        const pan = 1.5*horizontal[k]/Math.max(1,energy[k]);

        voice.pan.setTargetAtTime(
            Math.max(-1,Math.min(1,pan)),
            now,
            .18
        );
    });
}


// ==========================================
// SONIDO DE NUBES
// ==========================================

function updateCloudSound(full,base,now) {

    const {energy,movement,blue,pan} =
        measure('clouds',full,base);

    const brightness = 1-Math.exp(-energy/24);
    const drift = 1-Math.exp(-movement/14);

    cloudGain.gain.setTargetAtTime(
        brightness*(.18+.10*drift),
        now,
        .28
    );

    cloudFilter.frequency.setTargetAtTime(
        430+380*blue+240*drift,
        now,
        .3
    );

    cloudPan.pan.setTargetAtTime(pan,now,.28);
}


// ==========================================
// PROCESAMIENTO DEL AUDIO
// ==========================================

function renderSound() {

    const active = audio?.state === 'running';

    const effects = [

        {
            name:'aurora',
            object:aurora,
            key:'visible',
            off:false
        },

        {
            name:'waves',
            object:uniforms.uStrength,
            key:'value',
            off:0
        },

        {
            name:'temperature',
            object:uniforms.uTemperature,
            key:'value',
            off:0
        },

        {
            name:'clouds',
            object:cloudCover,
            key:'value',
            off:0
        }
    ];

    const sampled = {};

    if(active && audio.currentTime>=nextAudioUpdate) {

        nextAudioUpdate = audio.currentTime+.12;

        for(const effect of effects) {

            const value = effect.object[effect.key];

            if(!value) {

                delete previous[effect.name];

                continue;
            }

            effect.object[effect.key] = effect.off;

            try {

                renderer.render(scene,camera);

                sampled[effect.name] = framePixels();

            } finally {

                effect.object[effect.key] = value;
            }
        }
    }

    renderer.render(scene,camera);

    if(!active) return;

    const now = audio.currentTime;

    if(!uniforms.uStrength.value) {
        waves.gain.setTargetAtTime(0,now,.07);
    }

    if(!aurora.visible) {

        for(const voice of voices) {
            voice.gain.setTargetAtTime(0,now,.07);
        }
    }

    if(!cloudCover.value) {
        cloudGain.gain.setTargetAtTime(0,now,.09);
    }

    if(!uniforms.uTemperature.value) {

        for(const voice of thermalVoices) {
            voice.volume.setTargetAtTime(0,now,.07);
        }
    }

    if(!Object.keys(sampled).length) return;

    const full = framePixels();

    if(sampled.waves) {
        setNoise(
            'waves',
            full,
            sampled.waves,
            waves,
            filter,
            wavePan,
            now
        );
    }

    if(sampled.clouds) {
        updateCloudSound(full,sampled.clouds,now);
    }

    if(sampled.temperature) {
        updateTemperature(full,sampled.temperature,now);
    }

    const background = sampled.aurora;

    if(!background) return;

    const change = measure('aurora',full,background).movement;

    const energy = [0,0,0];
    const weightedX = [0,0,0];

    for(let i=0;i<full.length;i+=4) {

        const r = Math.max(0,full[i]-background[i]);
        const g = Math.max(0,full[i+1]-background[i+1]);
        const b = Math.max(0,full[i+2]-background[i+2]);

        const max = Math.max(r,g,b);

        const spread = max-Math.min(r,g,b);

        if(max<8 || spread<4) continue;

        const sector = max===r
            ? (g-b)/spread
            : max===g
                ? 2+(b-r)/spread
                : 4+(r-g)/spread;

        const hue = (sector*60+360)%360;

        const x = 2*((i/4)%64)/63-1;

        voices.forEach((voice,j) => {

            const distance = Math.abs(
                (hue-voice.hue+540)%360-180
            );

            const weight = Math.max(0,1-distance/65)*spread/255;

            energy[j] += weight;

            weightedX[j] += weight*x;
        });
    }

    voices.forEach((voice,i) => {

        const level = energy[i];

        const pan = level
            ? Math.max(-1,Math.min(1,1.6*weightedX[i]/level))
            : 0;

        voice.gain.setTargetAtTime(
            .11*[1,.8,.6][i]*
            (1-Math.exp(-level/16))*
            (1+.25*(1-Math.exp(-change/18))),
            now,
            .12
        );

        voice.pan.setTargetAtTime(pan,now,.16);
    });
}


// ==========================================
// ACTIVAR AUDIO CON INTERACCION DEL USUARIO
// ==========================================

for(const target of [
    canvas,
    document.getElementById('toggle-water'),
    document.getElementById('toggle-aurora'),
    document.getElementById('toggle-temperature'),
    document.getElementById('toggle-clouds')
]) {

    target.addEventListener('click',() => {
        startSound().catch(console.error);
    });
}


// ==========================================
// REDIMENSIONAR PANTALLA
// ==========================================

function resize() {

    const w = mount.clientWidth;
    const h = mount.clientHeight;

    camera.aspect = w / h;

    // Mantener la cámara mirando al centro de la Tierra
    camera.lookAt(0, 0, 0);

    camera.updateProjectionMatrix();

    renderer.setSize(w, h, false);
}

window.addEventListener('resize',resize);

resize();


// ==========================================
// ANIMACION PRINCIPAL
// ==========================================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(),.05);

    // Rotación de la Tierra
    globe.rotation.y = angle;
    globe.rotation.x = tilt;

    if(uniforms.uStrength.value>0) {
        uniforms.uTime.value += dt;
    }

    if(aurora.visible) {
        auroraUniforms.time.value += dt;
    }

    if(uniforms.uTemperature.value) {
        uniforms.uThermalTime.value += dt;
    }

    if(cloudLayer.visible) {
        cloudTime.value += dt;
    }

    // Zoom progresivo
    camera.position.z += (distance-camera.position.z)*.12;

    // Renderizado y sincronización del sonido
    renderSound();
}

animate();

}catch(e) {

    console.error(e);

    mount.innerHTML = `
        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:30px;
        ">
            <h2>No se pudo cargar la Tierra 3D</h2>
            <p>Comprueba tu conexión a Internet y recarga la página.</p>
            <p>Consulta la consola del navegador para ver el error.</p>
        </div>
    `;
}

</script>
